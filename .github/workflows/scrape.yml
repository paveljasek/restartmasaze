name: Update Website from Webnode

on:
  # Umožní spustit skript ručně tlačítkem v GitHubu
  workflow_dispatch:

  # Spustí se automaticky každou noc ve 03:00
  schedule:
    - cron: '0 3 * * *'

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Povolení k zápisu změn zpět do repozitáře

    steps:
      # Krok 1: Stáhnout kód z repozitáře
      - name: Checkout repository
        uses: actions/checkout@v4

      # Krok 2: Nastavit Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Krok 3: Nainstalovat knihovny potřebné pro scraper.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # Krok 4: Spustit tvůj scraper skript
      - name: Run scraper
        run: python scraper.py

      # Krok 5: Uložit změny a pushnout zpět do repozitáře
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "Žádné změny k uložení."
          else
            git commit -m "Automatická aktualizace webu z Webnode"
            git push origin main
          fi
